<ul>
  @for (film of data(); track film.url) {
    <li>
      <a [routerLink]="[film.url.split('/').at(-2)!]">
        {{ film.title }}
      </a>
      <span class="_details"> Episode {{ film.episode_id }} · {{ film.release_date }} </span>
    </li>
  } @empty {
    <li class="_empty">No films found.</li>
  }
</ul>
